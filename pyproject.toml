[project]
name = "document-stitch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lukáš Říha", email = "cedel@centrum.cz" }
]
requires-python = ">=3.15"
dependencies = [
    "img2pdf>=0.6.3",
    "pillow>=13.0.0",
]

[tool.black]
line-length = 120

[tool.pylint.format]
max-line-length = 120
indent-string = "    "

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "--import-mode=importlib"
pythonpath = ["src", "."]

[tool.coverage.run]
relative_files = true
source = ["src", "document_stitch"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.coverage.xml]
output = "coverage.xml"

[tool.pylint.main]
init-hook = "import sys; sys.path[:0] = ['src']"
ignored-modules = ["document_stitch"]

[tool.pylint.imports]
known-first-party = ["test", "document_stitch"]

[tool.pylint.design]
max-attributes = 15
max-args = 8
max-positional-arguments = 8

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pylint>=4.1.4",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
